<ui-component
	name="modal"
	path="mail.window"
	config="if:settings;width:900;center:true"
	id="settings"
	class="settings-modal settings-hub hidden"
	role="dialog"
	aria-modal="true"
	aria-labelledby="settings-title"
	><div class="settings-heading">
		<div class="modal-heading-content">
			<h2 id="settings-title">@(Workspace settings)</h2>
			<button class="icon-button exec" data-command="close-settings" data-exec="mail/click" aria-label="@(Close)">
				<i class="ti ti-times" aria-hidden="true"></i>
			</button>
		</div>
	</div>
	<div class="settings-body">
		@{view('#mail/views/settings-nav', 'settings')}
		<div class="modal-body-content">
			<h3 class="settings-section">@(Preferences)</h3>
			@{view('#reception/views/settings', model)}
			<ui-bind path="mail.ui" config="attr aria-checked button:String(!!value.threads)" class="block"
				><button type="button" role="switch" aria-checked="true" class="switch-row exec" data-exec="mail/togglethreads">
					<i class="ti ti-comments" aria-hidden="true"></i
					><span class="switch-text"><strong>@(Group conversations)</strong><small>@(Messages of the same conversation appear as one line.)</small></span
					><span class="switch-pill" aria-hidden="true"></span>
				</button></ui-bind
			>
			<ui-bind path="mail.ui" config="attr aria-checked button:String(!!value.notifications)" class="block"
				><button type="button" role="switch" aria-checked="false" class="switch-row exec" data-exec="mail/togglenotifications">
					<i class="ti ti-bell" aria-hidden="true"></i
					><span class="switch-text"><strong>@(Notifications)</strong><small><ui-bind path="mail.notifyHint" config="text"></ui-bind></small></span
					><span class="switch-pill" aria-hidden="true"></span>
				</button></ui-bind
			>
			<div class="hub-theme">
				<ui-component name="input" path="mail.theme" config="label:@(Appearance);dirsource:mail.themeOptions;$delay:1"></ui-component>
			</div>
			<div class="hub-language">
				<ui-component name="input" path="mail.language" config="label:@(Language);dirsource:mail.languageOptions;dirraw:1;$delay:1"></ui-component>
			</div>
		</div>
	</div>
	<div class="settings-footer"><div class="modal-footer-content"></div></div
></ui-component>
