name: Docker image

# A version tag (v1.1.0) publishes ghcr.io/totaljs-es/totalmail as 1.1.0, 1.1 and latest, for amd64 and arm64.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for this machine and wait for the health check
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: totalmail:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run -d --name totalmail -p 8000:8000 -e TRUST_PROXY=false totalmail:check
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ >/dev/null; then echo "healthy"; docker rm -f totalmail; exit 0; fi
            sleep 2
          done
          docker logs totalmail
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TotalMail
            org.opencontainers.image.description=Self-hosted email client built with Total.js

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
